---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    gameplane.local/crd-bundle-sha256: 5d7af9b51f0f0ee1e9b6571906765a9ca02fbf39c7a86720a11eab8c6533d201
    controller-gen.kubebuilder.io/version: v0.20.1
  name: repositories.gameplane.local
spec:
  group: gameplane.local
  names:
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    shortNames:
    - repo
    - repos
    singular: repository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.branch
      name: Branch
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Repository is a GitHub repository whose shared working copy lives on a PVC
          served by a repo agent pod. Ownership, collaborators and network use the
          same gameplane.local/owner-id, owner, collaborators and network annotations
          as GameServer.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RepositorySpec is the desired state of a Repository.
            properties:
              branch:
                maxLength: 255
                type: string
              storage:
                description: RepositoryStorage sizes the PVC holding the shared working
                  copy.
                properties:
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    type: string
                type: object
              url:
                maxLength: 512
                pattern: ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                type: string
                x-kubernetes-validations:
                - message: url is immutable
                  rule: self == oldSelf
            required:
            - url
            type: object
          status:
            description: RepositoryStatus is the observed state of a Repository.
            properties:
              ahead:
                format: int32
                type: integer
              behind:
                format: int32
                type: integer
              branch:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dirty:
                type: boolean
              head:
                type: string
              lastFetch:
                format: date-time
                type: string
              phase:
                description: RepositoryPhase is a high-level state for a Repository's
                  working copy.
                enum:
                - Pending
                - Cloning
                - Ready
                - Failed
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: repository names must be at most 52 characters
          rule: size(self.metadata.name) <= 52
    served: true
    storage: true
    subresources:
      status: {}
