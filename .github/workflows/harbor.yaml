name: harbor

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: harbor
  cancel-in-progress: false

jobs:
  images:
    if: github.repository == 'chunksmith/Gameplane'
    name: build & push harbor image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: operator
          - component: api
          - component: web
          - component: agent
          - component: audit-syslog-bridge
          - component: telemetry-receiver
          - component: sentinel
          - component: capture-sidecar
          - component: mcp-server
          - component: tunnel-frp
            dockerfile: tunnel/Dockerfile.frp
          - component: tunnel-tailscale
            dockerfile: tunnel/Dockerfile.tailscale
          - component: tunnel-playit
            dockerfile: tunnel/Dockerfile.playit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.chunksmith.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: registry.chunksmith.net/chunksmith/gameplane/${{ matrix.component }}
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.component) }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=edge-${{ github.sha }}
          cache-from: type=gha,scope=harbor-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=harbor-${{ matrix.component }}

  deploy:
    if: github.repository == 'chunksmith/Gameplane' && github.ref == 'refs/heads/master'
    name: deploy chunksmith
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: chunksmith
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: helm upgrade & restart control plane
        env:
          KUBECONFIG_DATA: ${{ secrets.CHUNKSMITH_KUBECONFIG }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_DATA" > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          helm upgrade gameplane charts/gameplane -n gameplane --reset-then-reuse-values --wait --timeout 10m
          kubectl -n gameplane rollout restart deploy/gameplane-operator deploy/gameplane-api deploy/gameplane-web
          for component in operator api web; do
            kubectl -n gameplane rollout status "deploy/gameplane-$component" --timeout 5m
          done
