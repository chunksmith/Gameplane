name: harbor

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: harbor
  cancel-in-progress: false

jobs:
  changes:
    if: github.repository == 'chunksmith/Gameplane'
    name: select harbor images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      images: ${{ steps.scope.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 hack/ci_scope.py images --workflow harbor.yaml --head "$HEAD_SHA"

  images:
    needs: [changes]
    if: needs.changes.outputs.images == 'true'
    name: build & push harbor image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: registry.chunksmith.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: registry.chunksmith.net/chunksmith/gameplane/${{ matrix.component }}
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.component) }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=edge-${{ github.sha }}
          cache-from: type=gha,scope=harbor-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=harbor-${{ matrix.component }}

  deploy:
    if: >-
      always() && github.repository == 'chunksmith/Gameplane' && github.ref == 'refs/heads/master'
      && needs.changes.result == 'success'
      && (needs.images.result == 'success' || needs.images.result == 'skipped')
    name: deploy chunksmith
    needs: [changes, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: chunksmith
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.120.21.107
      - name: helm upgrade & restart control plane
        env:
          KUBECONFIG_DATA: ${{ secrets.CHUNKSMITH_KUBECONFIG }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_DATA" > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          helm upgrade gameplane charts/gameplane -n gameplane --reset-then-reuse-values --wait --timeout 10m
          kubectl -n gameplane rollout restart deploy/gameplane-operator deploy/gameplane-api deploy/gameplane-web
          for component in operator api web; do
            kubectl -n gameplane rollout status "deploy/gameplane-$component" --timeout 5m
          done

  deploy-chicken-new:
    if: >-
      always() && github.repository == 'chunksmith/Gameplane' && github.ref == 'refs/heads/master'
      && needs.deploy.result == 'success'
    name: deploy chicken-new
    needs: [changes, images, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: chicken-new
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - name: helm upgrade with this commit's images
        env:
          KUBECONFIG_DATA: ${{ secrets.CHICKEN_NEW_KUBECONFIG }}
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          set -euo pipefail
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "::warning::CHICKEN_NEW_KUBECONFIG is not set in the chicken-new environment; skipping the deploy"
            exit 0
          fi
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_DATA" > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          registry=registry.chunksmith.net/chunksmith/gameplane
          tag="sha-${GITHUB_SHA::7}"
          args=()
          for component in $(jq -r '.include[]?.component' <<<"$MATRIX"); do
            case "$component" in
              operator|api|web) args+=(--set "$component.image.tag=$tag") ;;
              agent) args+=(--set "operator.agentImage=$registry/agent:$tag") ;;
              repo-agent) args+=(--set "repositories.agentImage=$registry/repo-agent:$tag") ;;
            esac
          done
          helm upgrade gameplane charts/gameplane -n gameplane --reset-then-reuse-values "${args[@]}" --wait --timeout 10m
          for component in operator api web; do
            kubectl -n gameplane rollout status "deploy/gameplane-$component" --timeout 5m
          done
